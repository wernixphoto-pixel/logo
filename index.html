<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Logo Overlay</title>

<style>
html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:transparent;
}

/* Logo */
.logo{
    position:fixed;

    /* Posisi kiri atas yang responsif */
    top:max(20px, 2vw);
    left:max(20px, 2vw);

    /* Ukuran responsif */
    width:clamp(80px, 6vw, 140px);
    height:auto;

    /* Transparansi */
    opacity:0.5;

    /* Supaya tidak mengganggu klik */
    pointer-events:none;
    user-select:none;

    /* Selalu berada di atas */
    z-index:9999;
}
</style>

</head>

<body>

<img
    class="logo"
    src="tanpa lingkaran.png"
    alt="Logo"
>

</body>
</html>
