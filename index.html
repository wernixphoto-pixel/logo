<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Logo kiri atas</title>

<style>
html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:transparent;
}

/* Logo */
.logo{
    position:fixed;

    /* Posisi kiri atas yang responsif */
    top:max(20px, 2vw);
    left:max(20px, 2vw);

    /* Ukuran responsif */
    width:clamp(80px, 6vw, 140px);
    height:auto;

    /* Supaya tidak mengganggu klik */
    pointer-events:none;
    user-select:none;

    /* Selalu berada di atas */
    z-index:9999;

    /* Total durasi animasi: 30s (muncul) + 5s (hilang) = 35s */
    animation: loopFade 35s infinite ease-in-out;
}

/* Keyframes untuk Kontrol Efek Fade */
@keyframes loopFade {
    0% {
        opacity: 0; 
    }
    1.43% {
        /* Fade in selama 0.5 detik (0.5s / 35s) */
        opacity: 0.5; 
    }
    84.29% {
        /* Tetap muncul sampai detik ke-29.5 (29.5s / 35s) */
        opacity: 0.5; 
    }
    85.71% {
        /* Fade out selama 0.5 detik (Selesai tepat di detik ke-30) */
        opacity: 0; 
    }
    100% {
        /* Tetap hilang selama 5 detik sisa (Detik ke-30 hingga 35) */
        opacity: 0; 
    }
}
</style>

</head>

<body>

<img
    class="logo"
    src="logo 220726.png"
    alt="Logo"
>

</body>
</html>
